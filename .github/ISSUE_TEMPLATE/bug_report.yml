name: Report Bug
description: Submit a bug report to help improve CoreMiner.
title: "[BUG] "
labels:
  - bug
assignees:
  - raisty
body:
  - type: markdown
    attributes:
      value: |
        Please provide as many details as possible to help us evaluate and resolve the bug report efficiently.

  - type: markdown
    attributes:
      value: |
        Hardware Information

  - type: input
    id: device
    attributes:
      label: Device
      description: Device being used
      placeholder: Device name

  - type: dropdown
    id: architecture
    attributes:
      label: CPU Architecture
      options:
        - arm
        - arm-be
        - arm64
        - arm64-be
        - x86
        - x86-64
    validations:
      required: true

  - type: input
    id: cpubrand
    attributes:
      label: CPU Brand
      description: CPU brand being used
      placeholder: CPU brand

  - type: input
    id: cpumodel
    attributes:
      label: CPU Model
      description: CPU model being used
      placeholder: CPU model

  - type: markdown
    attributes:
      value: |
        Software Information

  - type: input
    id: os
    attributes:
      label: OS and Version
      description: Operating system and version being used
      placeholder: OS
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Software Version
      description: Version of CoreMiner being used
      placeholder: Version
    validations:
      required: true

  - type: textarea
    id: bug
    attributes:
      label: Bug Description
      description: Describe the bug in detail
      placeholder: Bug description
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: 1. Step 1
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe the expected result
      placeholder: Result
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any additional information or screenshots
