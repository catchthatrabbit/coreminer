name: Feature Request
description: Suggest a new feature or enhancement for CoreMiner.
title: "[FEATURE] "
labels:
  - feature
assignees:
  - raisty
body:
  - type: markdown
    attributes:
      value: |
        Suggest a new feature or enhancement for CoreMiner. Our development team will review your proposal.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are you trying to solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: What alternatives have you considered?

  - type: textarea
    id: implementation
    attributes:
      label: Implementation Details
      description: Provide implementation details or code examples

  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any relevant information or screenshots
